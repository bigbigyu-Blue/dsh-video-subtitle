# dsh-video-subtitle bundle patch — one insert row over the profile tree.
# Defaults live here; override any field in profiles/<profile>/cordis.patch.yml
# (later layers win per row).
- insert:
    - id: videosub
      name: 'dsh-video-subtitle'
      config:
        # 总开关
        enabled: true
        # provider 尝试顺序；每一项对应 lib/providers/<名字>.js，写错/缺文件则跳过
        providerOrder: ['native', 'feiyudo', 'whisper', 'local']
        # 固定字幕落盘目录；留空 = 交给下面的 saveToWorkspace 策略
        saveDir: ''
        # true = 写进「发起这次调用的那个会话自己的工作区」，每次调用实时解析会话工作区路径，
        # 新建的会话/新建的工作区照样生效（不是写死某几个目录）
        saveToWorkspace: true
        # 会话工作区里的子目录名；插件落盘时自动创建，不是提前建好的目录
        workspaceSubdir: '.subtitles'
        # 语言偏好（按顺序取第一条命中的字幕轨）
        preferLang: ['zh', 'en']
        # 单个 provider 的超时（毫秒）
        timeoutMs: 90000
        # 第三方字幕站基地址（站点换域名时改这里）
        feiyudoBaseUrl: 'https://www.feiyudo.com'
        # 第三方站调用最小间隔（毫秒）——自控频率，防滥用
        feiyudoMinIntervalMs: 3000
        # 第三方站每天最多取几条（0 = 不自己限制，完全听站点的）。跨天自动归零，
        # 站点自己回「今日次数已达上限」时当天不再白打请求
        feiyudoDailyMax: 20
        # 本机 faster-whisper 转写（不依赖第三方、无次数限制，代价是慢）
        # python 环境与模型缓存留空 = 自动找 <DSH_HOME>/bili-duty 下现成的那套
        whisperPython: ''
        whisperHfHome: ''
        # 转写临时文件放哪；留空自动用 <DSH_HOME>/bili-duty/tmp/asr（系统临时目录在受限环境下不可写）
        whisperTmpDir: ''
        whisperModel: 'small'
        whisperThreads: 4
        # auto = 让模型自己判断语种；也可写 zh / en / ja
        whisperLang: 'auto'
        # 单个视频转写的时间上限（毫秒，默认 30 分钟）
        whisperTimeoutMs: 1800000
        # 超过这个时长的视频不做本地转写（分钟）
        whisperMaxMinutes: 180
        # 完整度门槛（百分比）：文稿覆盖不到这个比例就判为失败（残片）
        fullCoveragePct: 90
        # 只保留视频原文语种那一条（按标题+简介判断）；false = 保留全部语言轨
        keepOnlyOriginalLang: true
        # 本地转写：窗口长度（秒）、线程数、时长上限（分钟）
        localWindowSec: 30
        localThreads: 4
        localMaxMinutes: 240
        # 多语言轨时，取前多少秒音频判断原文语种（0 = 不探测）
        localProbeSec: 60
        # 留空 = 自动查找（ffmpeg 从 imageio-ffmpeg / PATH；sherpa 原生模块从 DSH 安装目录；模型从 <DSH_HOME>/speech-to-text）
        ffmpegPath: ''
        sherpaAddonPath: ''
        senseVoiceModel: ''
        senseVoiceTokens: ''
        # 缓存有效期（天）：命中则不发任何请求
        cacheTtlDays: 30
