# dsh-video-subtitle bundle patch — one insert row over the profile tree.
# Defaults live here; override any field in profiles/<profile>/cordis.patch.yml
# (later layers win per row).
# 普通人不用改这里：设置里的「视频字幕」页改的值写在 <DSH_HOME>/video-subtitle/settings.json，
# 读的时候盖在这份默认值上面，改完立刻生效，不用重启。
- insert:
    - id: videosub
      name: 'dsh-video-subtitle'
      config:
        # 总开关
        enabled: true
        # provider 尝试顺序；每一项对应 lib/providers/<名字>.js，写错/缺文件则跳过
        # native 是主力源：B站 官方 AI 字幕要「登录凭据 + WBI 签名」才给地址，匿名拿不到
        providerOrder: ['native', 'whisper', 'local']
        # 固定字幕保存目录；留空 = 交给下面的 saveToWorkspace 策略
        saveDir: ''
        # true = 写进「发起这次调用的那个会话自己的工作区」，每次调用实时解析会话工作区路径，
        # 新建的会话/新建的工作区照样生效（不是写死某几个目录）
        saveToWorkspace: true
        # 会话工作区里的子目录名；写文件时自动创建，不是提前建好的目录
        workspaceSubdir: '.subtitles'
        # 语言偏好（按顺序取第一条命中的字幕轨）
        preferLang: ['zh', 'en']
        # 单个 provider 的超时（毫秒）
        timeoutMs: 90000
        # B站 登录凭据：只在本机内存里用，不打印、不写回、不上传
        # 日常不用填这里：到「设置 → 视频字幕」页点扫码登录，用手机 B站 一扫就好
        # biliCookie 留空 = 先用设置页扫码登录存下的 <DSH_HOME>/video-subtitle/bili-login.json，
        # 其次兼容旧的 <DSH_HOME>/bili-duty/bili_credential.json
        # biliCredentialFile 留空 = 按上面的顺序自动找；填了就只读填的那个文件
        biliCookie: ''
        biliCredentialFile: ''
        # 本机 faster-whisper 转写（不依赖外部服务、无次数限制，代价是慢）
        # 日常不用填：到「设置 → 视频字幕」页点一键安装，就装在 <DSH_HOME>/video-subtitle/asr 下
        # python 环境与模型缓存留空 = 用一键安装的那套；本机已有旧的 bili-duty 那套就接着用，不逼人重装
        whisperPython: ''
        whisperHfHome: ''
        # 转写临时文件放哪；留空就跟着实际用的 Python 走（复用旧环境时用它旁边的 tmp，
        # 因为那套解释器只写得了自己那棵树），建不出来会依次退到备用目录
        # （系统临时目录在受限环境下可能不可写）
        whisperTmpDir: ''
        whisperModel: 'small'
        whisperThreads: 4
        # 批处理一次喂几段音频：实测比逐段转写快约 1.25 倍；0 = 关掉批处理退回逐段
        whisperBatchSize: 8
        # 批处理拿到的词级时间戳按多少字收一条：越小越细碎
        whisperMaxChars: 24
        # auto = 让模型自己判断语种；也可写 zh / en / ja
        whisperLang: 'auto'
        # 单个视频转写的时间上限（毫秒，默认 30 分钟）
        whisperTimeoutMs: 1800000
        # 超过这个时长的视频不做本地转写（分钟）
        whisperMaxMinutes: 180
        # 转写进程常驻复用：模型只加载一次，连着取多条时后面的明显更快；false = 每条新开进程（排障对比用）
        whisperReuseModel: true
        # 完整度门槛（百分比）：文稿覆盖不到这个比例就判为失败（残片）
        fullCoveragePct: 90
        # 只保留视频原文语种那一条（按标题+简介判断）；false = 保留全部语言轨
        keepOnlyOriginalLang: true
        # 本地转写：窗口长度（秒）、线程数、时长上限（分钟）
        localWindowSec: 30
        localThreads: 4
        localMaxMinutes: 240
        # 多语言轨时，取前多少秒音频判断原文语种（0 = 不探测）
        localProbeSec: 60
        # 留空 = 自动查找（ffmpeg 从 imageio-ffmpeg / PATH；sherpa 原生模块从 DSH 安装目录；模型从 <DSH_HOME>/speech-to-text）
        ffmpegPath: ''
        sherpaAddonPath: ''
        senseVoiceModel: ''
        senseVoiceTokens: ''
        # 缓存有效期（天）：命中则不发任何请求
        cacheTtlDays: 30
        # 批量取字幕单次最多跑几条（合集有很多分P时防止一次跑太久）；被截掉的条数会如实报出来
        batchMaxItems: 20
